repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: Ruff Format
        entry: uv run ruff format
        language: system
        types: [python]

      - id: ruff-check
        name: Ruff Check
        entry: uv run ruff check
        language: system
        types: [python]

      - id: mypy
        name: Mypy
        entry: uv run mypy src
        language: system
        pass_filenames: false

      - id: pytest
        name: Pytest
        entry: uv run pytest
        language: system
        pass_filenames: false