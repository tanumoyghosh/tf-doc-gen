[project]
name = "tf-doc-gen"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tanumoy Ghosh", email = "tanumoyghosh@ymail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "python-hcl2>=8.1.2",
    "typer>=0.27.0",
]

[project.scripts]
tf-doc-gen = "tf_doc_gen:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
disallow_untyped_defs = true
no_implicit_optional = true
strict = true

[[tool.mypy.overrides]]
module = ["hcl2"]
ignore_missing_imports = true